# Theme Settings

# See also: https://mmistakes.github.io/minimal-mistakes/docs/configuration

# Your site's logo. Will be shown on the left top of your page.
#logo: /files/crazy-cleats.svg
#logo: /files/yhs-field-1.png
#logo: /files/maysl-logo-sidebar.png
logo: /files/maysl-logo.png
# If the images of our blog are stored in an external cloud,
# you can use the jekyll-img-prefix plugin and set your image's base URL here.
# img_prefix: https://your-img-cdn.com
# # The RSS link of your blog.
# rss: "/feed.xml"

minimal_mistakes_skin: maysl-summer-2026

# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#seo-social-sharing-and-analytics-settings
analytics:
  provider: google-gtag
  google:
    tracking_id: G-3YQ3FTWMRY
    anonymize_ip: false

twitter:
  username: ohshaughnessy
facebook:
  username: mountainyouthsoccer
og_image: /files/maysl-logo-small.png
social:
  type: Organization # Person or Organization (defaults to Person)
  name: Mountain Area Youth Soccer League # If the user or organization name differs from the site's name
  links:
    - https://www.facebook.com/mountainyouthsoccer
    #- https://twitter.com/yourTwitter
    #- https://instagram.com/yourProfile
    #- https://www.linkedin.com/in/yourprofile
footer:
  links:
    - label: About
      url: /about/
      icon: fas fa-futbol
    - label: Contact
      url: /contact/
      icon: fas fa-comments
    #- label: Twitter
    #  icon: fab fa-fw fa-twitter-square
    #  url: https://twitter.com/mmistakes
    #- label: Instagram
    #  icon: fab fa-fw fa-instagram
    #  url: https://instagram.com/mmistakes
    - label: Facebook
      icon: fab fa-fw fa-facebook
      url: https://facebook.com/mountainyouthsoccer
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/oshaughnessy/maysl.soccer

defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      sidebar: 
        #title: Schedules
        #nav: schedules-by-division
        # Hardcoded: front matter and _config.yml can't use Liquid, so this
        # can't read `label` from _data/season.yml. Keep the two in sync.
        title: 2026/27 Signups
        nav: signups
        #title: Off-Season
        #nav: off-season
      toc_sticky: true
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      # Breadcrumbs are built from the URL path, so a dated post at
      # /2022/07/01/x.html yields crumbs linking /2022, /07 and /01 -- and
      # there are no date archives behind them, so all three 404. Pages get
      # sensible crumbs (Home / Parents); posts don't.
      breadcrumbs: false
      read_time: false
      comments: false
      share: true
      related: true
      sidebar: 
        #title: schedules
        #nav: schedules-by-division
        # Hardcoded: front matter and _config.yml can't use Liquid, so this
        # can't read `label` from _data/season.yml. Keep the two in sync.
        title: 2026/27 Signups
        nav: signups
        #title: Off-Season
        #nav: off-season

  # schedules/<year>/ pages
  - scope:
      path: "schedules"
    values:
      # Same breadcrumb problem as posts: crumbs are built from the URL path
      # without accumulating it, so /schedules/2022/x.html links its middle
      # crumb to /2022 rather than /schedules/2022 -- and neither exists.
      breadcrumbs: false

include: ["_pages"]

# `paginate` and `home_articles` used to live here and did nothing. The old
# GitHub Pages builder force-loaded jekyll-paginate, but pagination needs an
# index.html template that this site has never had, so it only ever emitted a
# warning; `home_articles` was read by nothing at all. _layouts/home.html
# selects posts by season tag instead -- see `tag` in _data/season.yml.

# Season dates, phase, registration links, and the season post tag all live in
# _data/season.yml -- see the comments there. Kept out of this file so they can
# be edited without restarting `make serve`.

# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#site-search
search: true
search_provider: lunr
search_full_content: true
lunr:
  search_within_pages: true
#google:
#  search_engine_id: 462070f4ab7ad47f3

breadcrumbs: true
breadcrumb_home_label : Home
breadcrumb_separator  : /
