---
# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `bundle exec jekyll serve`. If you change this file, please restart the server
# process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

timezone: America/Los_Angeles

title: MAYSL
email: shaug-maysl@wumpus.org
# Default is your site title.
description: >-
  Mountain Area Youth Soccer League
#author: O'Shaughnessy Evans
# the subpath of your site, e.g. /blog
baseurl: ""
# base hostname & protocol for your site, e.g. http://example.com
url: https://maysl.soccer
source_url: https://github.com/oshaughnessy/maysl.soccer/

# Build settings
# theme: minima
# theme: jekyll-theme-tactile
# theme: jekyll-theme-persephone
# remote_theme: pages-themes/midnight@v0.2.0
#remote_theme: erlzhang/jekyll-theme-persephone
# The theme comes from the bundled gem, so Gemfile.lock is the single source of
# its version. This used to be `remote_theme:` because the old GitHub Pages
# builder ran its own gemset and couldn't see ours; now that Actions builds with
# `bundle exec`, both local and CI resolve the theme the same way -- and there's
# no second copy of the version to drift out of sync.
theme: minimal-mistakes-jekyll
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# The theme's Sass is still written for the old @import-based Dart Sass, so it
# emits hundreds of deprecation warnings we can't fix from here. quiet_deps
# hushes warnings originating in dependencies (anything loaded from a load path,
# i.e. the theme) while still reporting problems in our own _sass/ files.
sass:
  quiet_deps: true
  # Our own main.scss still uses @import, and can't stop: Minimal Mistakes'
  # skin system relies on @import's global scope -- the skin sets
  # $primary-color and the theme's partials read it, which breaks under @use's
  # namespacing. Revisit if the theme ever ships as Sass modules.
  silence_deprecations:
    - import
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - .minimal-mistakes
  - .persephone
  - Makefile
  - '**/Makefile'
  - '.*.swp'
  - '.*.swo'
  # Developer docs, not site content. These must stay excluded: the
  # github-pages gem force-loads jekyll-optional-front-matter, which turns
  # every root .md into a rendered page -- so CLAUDE.md's Liquid examples get
  # parsed as real tags and fail the build. They'd also be publicly readable.
  - CLAUDE.md
  - PHASES.md
  - .claude
  # GA4 snapshots kept for comparison over time -- see analytics/README.md.
  - analytics

# # Your social accounts.
#social:
#  github: oshaughnessy/maysl.soccer
#  twitter: ohshaughnessy
