<!-- Google Fonts - Optimized Loading -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 
  Optimizations:
  - subset=latin: Only load Latin characters (reduces file size)
  - display=swap: Show fallback font immediately, swap when custom font loads
  - Preconnect: Establishes early connection to Google Fonts servers
-->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Montserrat:wght@500;600;700&display=swap&subset=latin" rel="stylesheet">

<!-- ref: https://github.com/mmistakes/minimal-mistakes/issues/949 -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/fav/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/fav/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/fav/favicon-16x16.png">
<link rel="manifest" href="/assets/fav/site.webmanifest">
<link rel="mask-icon" href="/assets/fav/safari-pinned-tab.svg" color="#5bbad5">
<link rel="shortcut icon" href="/assets/fav/favicon.ico">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="msapplication-config" content="/assets/fav/browserconfig.xml">
<meta name="theme-color" content="#ffffff">

<!-- Structured data: a machine-readable version of facts that are already on
     /about/ and /contact/. Search engines can't reliably infer "youth soccer
     league serving these five towns" from prose, and local results ("oakhurst
     soccer", "youth soccer near me") are where we're weakest. SportsOrganization
     is more specific than the plain Organization the theme emits from
     site.social; both can coexist and Google prefers the richer one.

     Keep this in sync with /about/ and /contact/ if the towns or address
     change. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsOrganization",
  "name": "Mountain Area Youth Soccer League",
  "alternateName": "MAYSL",
  "sport": "Soccer",
  "url": {{ site.url | jsonify }},
  "logo": {{ site.url | append: "/files/maysl-logo.png" | jsonify }},
  "description": {{ site.description | strip | jsonify }},
  "nonprofitStatus": "Nonprofit501c3",
  "address": {
    "@type": "PostalAddress",
    "postOfficeBoxNumber": "908",
    "addressLocality": "Coarsegold",
    "addressRegion": "CA",
    "postalCode": "93614",
    "addressCountry": "US"
  },
  "areaServed": [
    { "@type": "Place", "name": "Oakhurst, California" },
    { "@type": "Place", "name": "Coarsegold, California" },
    { "@type": "Place", "name": "North Fork, California" },
    { "@type": "Place", "name": "Ahwahnee, California" },
    { "@type": "Place", "name": "Bass Lake, California" }
  ],
  "sameAs": [
    "https://www.facebook.com/mountainyouthsoccer"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "general enquiries",
    "url": {{ site.url | append: "/contact/" | jsonify }}
  }
}
</script>
