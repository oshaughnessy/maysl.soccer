# Single source of truth for the current season.
#
# Lives in _data/ (not _config.yml) on purpose: Jekyll reloads _data on every
# rebuild, so `make serve` picks up changes here without a restart.
#
# At the start of each season, update: year, label, tag, game_days, and the
# three `register` links. Then flip `phase` as the season progresses.

year:  2026
label: "2026/27"

# Posts tagged with this show up on the home page. Every current-season post
# needs `tags: <this value> ...` in its front matter.
tag: 2026-season

# Which part of the year we're in. Set by hand -- GitHub Pages only rebuilds
# on push, so a date-computed value would sit stale between commits.
#   signup    -- registration open, no teams yet     (Jun-Aug)
#   preseason -- teams assigned, practices starting  (late Aug)
#   season    -- games underway                      (Sep-Nov)
#   wrapup    -- season over, off-season ahead       (Nov-Dec)
#   offseason -- adult winter league, spring travel  (Dec-May)
phase: preseason

# Whether we're still taking late registrations. Shown as a note on the
# preseason home card; set false once rosters are locked.
registration_open: true

dates:
  # Monday of the week rec practices begin -- rendered as "the week of ..."
  # since exact days depend on school field approval and vary by coach. Rec
  # practices start 2-3 weeks before first games; travel teams start earlier.
  practices_start: "2026-08-24 PDT"

# Every rec game weekend, in order, earliest first. This is the single source
# of truth for the season's shape: opening day is the first entry, the last
# game is the last entry, and _includes/schedule.html marks "you are here" by
# this list's position rather than by counting calendar weeks.
#
# The skipped weekend has to live here. Calendar arithmetic can't infer it, and
# assuming an unbroken run of weeks put the marker one column too far right for
# the back half of every season.
#
# We play the first weekend of a school break and skip the last. Bass Lake
# JUESD's 2026-27 fall break is Oct 12-16, so 10/10 is played and 10/17 is not.
# The season ends the weekend before Thanksgiving (Nov 26 in 2026).
#
# Quote the dates so YAML keeps them as strings for Liquid's `date` filter.
game_days:
  - "2026-09-12"
  - "2026-09-19"
  - "2026-09-26"
  - "2026-10-03"
  - "2026-10-10"
  # 2026-10-17 skipped -- last weekend of fall break
  - "2026-10-24"
  - "2026-10-31"
  - "2026-11-07"
  - "2026-11-14"
  - "2026-11-21"

# Winter adult league. The signup window is tight, so the home page primes
# people well before it opens: from `promo_starts` (mid-October, while the youth
# season is still running and parents are between their own sports seasons),
# through signups the Monday after Thanksgiving, teams forming over December,
# and first games the second weekend of January.
adult:
  promo_starts:  "2026-10-10 PDT"   # start advertising on the home page
  signups_open:  "2026-11-30 PST"   # Monday after Thanksgiving and Black Friday
  first_game:    "2027-01-09 PST"   # 2nd weekend of January

# Player registration fees in whole dollars, adjusted annually. Rendered with
# a "$" by the pages that use them, so keep these as bare numbers.
fees:
  clinic: 90     # U4-U5 coed clinic players; includes a jersey
  standard: 115  # every other division
  jersey: 20     # only for non-clinic players who need one

# GotSport program registration links, one per audience.
register:
  players:  https://system.gotsport.com/programs/68354178H
  coaches:  https://system.gotsport.com/programs/16380S251
  referees: https://system.gotsport.com/programs/174179D24

# Flip to true once the division schedules are posted under /schedules/<year>/.
schedules_posted: false
